<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}i farted{% endblock %}</title>
    <link rel="icon" type="image/png" href="https://github.com/nameisntdavid.png?size=32">
    <link rel="icon" type="image/png" sizes="192x192" href="https://github.com/nameisntdavid.png?size=192">
    <link rel="apple-touch-icon" href="https://github.com/nameisntdavid.png?size=180">
    <script src="/static/js/htmx.min.js"></script>
    <script>
    (function () {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
    })();
    </script>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    {% block active_tab %}{% endblock %}

    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="nav-brand">
                {% include "components/avatar.html" %}
                i farted
            </a>
            <div class="nav-tabs">
                <a href="/" class="nav-tab {% block tab_home %}{% endblock %}">Home</a>
                <a href="/blogs" class="nav-tab {% block tab_blogs %}{% endblock %}">Blogs</a>
                <a href="/projects" class="nav-tab {% block tab_projects %}{% endblock %}">Projects</a>
                <a href="https://github.com/nameisntdavid" target="_blank" rel="noopener" class="nav-icon" aria-label="GitHub">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
                    </svg>
                </a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false" type="button">
                <svg class="icon-monitor" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                    <line x1="8" y1="21" x2="16" y2="21"/>
                    <line x1="12" y1="17" x2="12" y2="21"/>
                </svg>
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                </svg>
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <div class="footer-content">
                <a href="https://www.florenzo.space">i farted</a>
            </div>
        </div>
    </footer>

    <script>
    (function() {
        const toggle = document.getElementById('theme-toggle');
        const root = document.documentElement;
        const STORAGE_KEY = 'theme-preference';
        const THEMES = ['system', 'light', 'dark'];

        function applyTheme(theme) {
            root.removeAttribute('data-theme');
            if (theme === 'light' || theme === 'dark') {
                root.setAttribute('data-theme', theme);
            }
            toggle.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
            toggle.setAttribute('aria-label',
                theme === 'system' ? 'Theme: system default (click to switch)' :
                theme === 'light' ? 'Theme: light (click to switch)' :
                'Theme: dark (click to switch)'
            );
            localStorage.setItem(STORAGE_KEY, theme);
        }

        function cycleTheme() {
            const current = localStorage.getItem(STORAGE_KEY) || 'system';
            const next = THEMES[(THEMES.indexOf(current) + 1) % THEMES.length];
            applyTheme(next);
        }

        applyTheme(localStorage.getItem(STORAGE_KEY) || 'system');
        toggle.addEventListener('click', cycleTheme);
    })();
    </script>
</body>
</html>
